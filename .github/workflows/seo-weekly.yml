name: Weekly SEO

# Every Monday 04:00 UTC (08:00 Dubai). Also runnable by hand from the Actions
# tab — use that for the first run, to see the report before trusting the cron.
#
# What one run does, in order:
#   1. Self-test the SEO scripts. If these fail nothing else runs, so a broken
#      generator can never rewrite 175 page titles.
#   2. Refresh src/generated/seoOverrides.json from Search Console and commit it
#      if it changed. This is the part that "keeps updating according to search".
#   3. Trigger a Vercel deploy, so the sitemap, <lastmod> values and the prerender
#      are rebuilt from live company data even in a week with no code changes.
#   4. Audit the deployed site and commit seo/report-latest.md.
#   5. Open a GitHub issue with the report, which is the weekly submission.
#
# Required secrets (both optional — the job degrades and says so in the report):
#   GSC_SERVICE_ACCOUNT_JSON   Search Console service-account key (see SEO.md)
#   VERCEL_DEPLOY_HOOK_URL     Vercel -> Project -> Settings -> Git -> Deploy Hooks
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip the Vercel deploy and audit whatever is live now'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-weekly
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Self-test the SEO scripts
        run: node scripts/seo-selftest.mjs

      - name: Refresh title/meta overrides from Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/gen-eligibility.mjs || echo "eligibility refresh failed — the generator falls back to the committed file"
          node scripts/gen-seo-overrides.mjs

      - name: Commit the refreshed overrides
        id: commit_overrides
        run: |
          git config user.name  "quvera-seo-bot"
          git config user.email "noreply@quvera.ae"
          git add src/generated/seoOverrides.json src/generated/eligibility.json public/sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No override changes this week."
          else
            git commit -m "SEO: weekly refresh of search-derived title/meta overrides"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebuilds the live site so the sitemap, its <lastmod> values, the
      # prerendered HTML and any refreshed override all reach production. Without
      # this a week with no commits ships a month-old sitemap.
      - name: Trigger a Vercel rebuild
        if: ${{ !inputs.skip_deploy && secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo "deploy hook responded $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || echo "::warning::deploy hook returned $code — auditing whatever is live"

      # The prerender crawl of ~1,700 routes is the long pole in a Vercel build, so
      # this polls the build's own timestamp instead of sleeping a guessed number
      # of minutes — otherwise the audit reads last week's HTML and reports it as
      # this week's. Gives up after 35 minutes and audits whatever is live.
      - name: Wait for the deploy to land
        if: ${{ !inputs.skip_deploy && secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          started=$(date -u +%s)
          for i in $(seq 1 70); do
            built=$(curl -fsS https://www.quvera.ae/__prerender_stats.json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(String(Math.floor(Date.parse(JSON.parse(d).builtAt)/1000)||0))}catch{process.stdout.write("0")}})' || echo 0)
            if [ "${built:-0}" -gt "$started" ]; then
              echo "new build is live (built $(date -u -d @"$built" +%H:%M:%S)Z)"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::deploy did not land within 35 minutes — auditing whatever is live"

      - name: Audit the live site
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seo-audit.mjs --companies 80

      - name: Commit the report
        run: |
          git config user.name  "quvera-seo-bot"
          git config user.email "noreply@quvera.ae"
          git pull --rebase --autostash || true
          git add seo/
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "SEO: weekly report $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Submit the report as an issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('seo/report-latest.md', 'utf8')
            const date = new Date().toISOString().slice(0, 10)
            // GitHub rejects a body over 65536 characters; the committed file in
            // seo/report-latest.md is always the complete one.
            const trimmed = body.length > 60000
              ? body.slice(0, 60000) + '\n\n_Truncated — full report in `seo/report-latest.md`._\n'
              : body
            const errors = (body.match(/\*\*(\d+) errors/) || [])[1] || '0'
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `SEO report ${date}${Number(errors) > 0 ? ` — ${errors} errors` : ''}`,
              body: trimmed + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n',
            }
            try {
              await github.rest.issues.create({ ...issue, labels: ['seo', 'report'] })
            } catch (e) {
              // A repo without those labels must still get its report.
              core.warning(`labelled issue failed (${e.message}) — posting without labels`)
              await github.rest.issues.create(issue)
            }
