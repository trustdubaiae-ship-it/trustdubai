    <!-- Body font, self-hosted. Google Fonts put two origins in series on the
         critical path — fonts.googleapis.com for the stylesheet, then
         fonts.gstatic.com for the files, which are only discoverable once that
         stylesheet parses. Cold from Dubai that measured 440ms + 477ms of
         DNS+TLS before a glyph was even requested. Served from here both
         handshakes are gone and the preload scanner sees the file immediately.
         Regenerate with `npm run fonts`. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/rP2Hp2ywxg089UriCZOIHQ.woff2" />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Icon font is self-hosted and subsetted. The CDN stylesheet was 211 KB of
         ~5,800 icons, render-blocking, on a third-party origin that costs a full
         DNS+TLS handshake (measured 553ms cold). This site uses 68 icons, so the
         generated subset is 3.2 KB and same-origin, on a connection already open.
         Regenerate with `npm run icons` after adding an icon — the script fails
         loudly on any class it cannot find.

         Do not take either stylesheet off the critical path. It has been tried
         twice and measured both times; it is worse for this site, every time:

           blocking (current)   FCP 5.4s  LCP 6.5s  CLS 0.132  score 58
           async (media=print)  FCP 6.3s  LCP 8.9s  CLS 0.613  score 37

         The body font is the reason. Non-blocking means text paints in the
         fallback and then reflows the whole page when DM Sans arrives — that is
         the 0.613. "Render-blocking requests" reports a large saving here and it
         is real, but taking it costs far more elsewhere.

         The version pin stays (was @latest): jsDelivr caches a pinned version for
         a year vs 7 days, and @latest would ship a breaking tabler release
         straight to production with no deploy. -->
    <link rel="stylesheet" href="/fonts/tabler-icons.subset.css" />
